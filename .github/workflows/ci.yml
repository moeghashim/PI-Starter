name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks-summary:
    name: Required checks
    if: ${{ always() }}
    needs: [required-checks, web-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        if: ${{ needs.required-checks.result != 'success' || needs.web-builds.result != 'success' }}
        run: exit 1

  web-builds:
    name: Web builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Check if web build inputs changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$PR_BASE"..."$PR_HEAD" | grep -qE '^(apps/|packages/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig.*\.json|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # Nitro output covers Vercel, Node, and other hosts; the Cloudflare build targets Workers.
      - name: Build web app (Nitro)
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @pi-starter/web run build

      - name: Build web app (Cloudflare)
        if: steps.changes.outputs.run == 'true'
        run: pnpm run build:cloudflare

  required-checks:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect upstream skill changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "upstream=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$PR_BASE"..."$PR_HEAD" | grep -qE '^(agent/|\.agents/skills/|scripts/agent-sync\.mjs)'; then
            echo "upstream=true" >> "$GITHUB_OUTPUT"
          else
            echo "upstream=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Warn about PR size
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm run pr:size -- "$PR_BASE" "$PR_HEAD"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks, tests, guardrails, and Fallow in parallel
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm run ci:validate

      - name: Verify vendored files against pinned upstream
        if: steps.changes.outputs.upstream == 'true'
        run: pnpm run agent:verify-upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
