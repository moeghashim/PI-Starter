name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks-summary:
    name: Required checks
    if: ${{ always() }}
    needs: [required-checks, web-builds, fallow-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Every job must succeed; only fallow-audit may also be skipped (on non-PR events).
      - name: Require successful validation
        if: ${{ needs.required-checks.result != 'success' || needs.web-builds.result != 'success' || (needs.fallow-audit.result != 'success' && needs.fallow-audit.result != 'skipped') }}
        run: exit 1

  web-builds:
    name: Web builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @pi-starter/web
      - run: npm run build:cloudflare

  fallow-audit:
    name: Fallow audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit changed code
        uses: fallow-rs/fallow@965f068ca91c11d6ab2a631101bcd3709569c422 # v3.46.0
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          # Keep the audit based on the current route tree.
          no-cache: true

  required-checks:
    name: Required checks
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Warn about PR size
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: npm run pr:size -- "$PR_BASE" "$PR_HEAD"

      - name: Install dependencies
        run: npm ci

      # The web builds run separately. Build only publishable packages in this job.
      - name: Build packages
        run: npm run build -w packages --if-present

      - name: Check formatting, linting, and types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run agent guardrails
        run: npm run agent:check

      - name: Verify vendored files against pinned upstream
        run: npm run agent:verify-upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
