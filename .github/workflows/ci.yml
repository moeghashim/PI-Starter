name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks-summary:
    name: Required checks
    if: ${{ always() }}
    needs: [required-checks, cloudflare-build, fallow-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          for (const name of ['required-checks', 'cloudflare-build', 'fallow-audit']) {
            const result = needs[name]?.result;
            const expectedSkip = name === 'fallow-audit' && process.env.EVENT_NAME !== 'pull_request' && result === 'skipped';
            if (result !== 'success' && !expectedSkip) {
              console.error(`${name}: ${result ?? 'missing'}`);
              process.exitCode = 1;
            }
          }
          NODE

  cloudflare-build:
    name: Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare

  fallow-audit:
    name: Fallow audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npm exec -w @pi-starter/web -- next typegen

      - name: Audit changed code
        uses: fallow-rs/fallow@3f6d4a5f817525d322365d64953940ff47175bf2 # v3.9.1
        with:
          command: audit
          gate: new-only
          fail-on-issues: true
          # Re-resolve generated types instead of restoring stale missing-import results.
          no-cache: true

  required-checks:
    name: Required checks
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Cloudflare build job runs the full Next.js production build once.
      # Here, build the publishable packages and generate Next.js route types for type checking.
      - name: Build packages
        run: npm run build -w packages --if-present

      - name: Generate Next.js types
        run: npm exec -w @pi-starter/web -- next typegen

      - name: Check formatting, linting, and types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Run agent guardrails
        run: npm run agent:check

      - name: Verify vendored files against pinned upstream
        if: matrix.os == 'ubuntu-latest'
        run: npm run agent:verify-upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
