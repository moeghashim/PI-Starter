# Keep push-time gate commands deterministic instead of relying on agent auto-detection.
# The gate shell does not load the developer's profile, so select the Node pinned in
# .nvmrc explicitly; scripts/preflight-native-deps.mjs fails on any other major.
commands:
  test: ". \"${NVM_DIR:-$HOME/.nvm}/nvm.sh\" --no-use && nvm use --silent && npm ci && npm test"
  lint: ". \"${NVM_DIR:-$HOME/.nvm}/nvm.sh\" --no-use && nvm use --silent && npm ci && npm run check && npm run agent:check && npm run fallow:audit"
  format: "npx biome format --write ."
