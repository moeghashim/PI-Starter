# Keep push-time gate commands deterministic instead of relying on agent auto-detection.
# The gate shell does not load the developer's profile, so select the Node pinned in
# .nvmrc explicitly; scripts/preflight-native-deps.mjs fails on any other major.
# Prepend the resolved bin directory instead of calling `nvm use`: under bash/sh nvm
# swaps an existing nvm PATH segment in place, which can leave another Node ahead of it.
commands:
  test: ". \"${NVM_DIR:-$HOME/.nvm}/nvm.sh\" --no-use && PATH=\"$(dirname \"$(nvm which --silent)\"):$PATH\" && npm ci && npm test"
  lint: ". \"${NVM_DIR:-$HOME/.nvm}/nvm.sh\" --no-use && PATH=\"$(dirname \"$(nvm which --silent)\"):$PATH\" && npm ci && npm run check && npm run agent:check && npm run fallow:audit"
  format: "npx biome format --write ."
